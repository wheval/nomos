name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NOMOS_STORE_DRIVER: memory
      # Placeholder only — the RPC providers are constructed at build time
      # but never actually called during lint/typecheck/test/build.
      NEXT_PUBLIC_PROVIDER_URL: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm, not yarn: yarn.lock had drifted out of sync with what actually
        # installs, and the two lockfiles disagreed. The privacy SDK lives on
        # GitHub Packages, so .npmrc needs a token that can read it.
        run: npm ci
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
