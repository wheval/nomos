name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NOMOS_STORE_DRIVER: memory
      # Placeholder only — the RPC providers are constructed at build time
      # but never actually called during lint/typecheck/test/build.
      NEXT_PUBLIC_PROVIDER_URL: ci-placeholder
      # Job-level so every step sees it — .npmrc expands ${GH_PACKAGES_TOKEN}
      # to reach @starkware-libs on GitHub Packages.
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm, not yarn: yarn.lock had drifted out of sync with what actually
        # installs, and the two lockfiles disagreed. The privacy SDK lives on
        # GitHub Packages, so .npmrc needs a token that can read it.
        #
        # `npm install`, not `npm ci`: sharp pulls platform-specific optional
        # dependencies, so a lockfile resolved on macOS legitimately lacks the
        # Linux ones (@emnapi/*) that this runner needs, and `npm ci` treats
        # that as the lockfile being out of sync. install resolves them and
        # still honours the lockfile for everything else.
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "GH_PACKAGES_TOKEN is empty — set it as a repository secret (needs read:packages)."
            exit 1
          fi
          # Write the token into the runner's own npmrc rather than relying on
          # .npmrc's ${VAR} expansion. The expansion resolved for metadata but
          # not for the tarball fetch, which 401'd as "token not provided" —
          # @starkware-libs metadata is readable anonymously, so an empty
          # expansion looks fine right up until the download.
          npm config set //npm.pkg.github.com/:_authToken "$GH_PACKAGES_TOKEN"
          echo "token length: ${#GH_PACKAGES_TOKEN}, starts: ${GH_PACKAGES_TOKEN:0:4}"
          npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
